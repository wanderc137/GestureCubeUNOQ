<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Arquitectura de GestureCube UNO Q</title>
  <desc id="dsc">Flujo completo: cámara USB UVC, V4L2 y OpenCV en la UNO Q, MJPEG por HTTP, navegador con MediaPipe Tasks Vision en WASM y cubo Rubik CSS 3D.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0e1a2b" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zoneUno" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#060b14"/>
    </linearGradient>
    <linearGradient id="zoneWeb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120b18"/>
      <stop offset="1" stop-color="#080a12"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1726"/>
      <stop offset="1" stop-color="#0a121e"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#00d4ff"/>
    </marker>
    <marker id="arwPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#ff4fd8"/>
    </marker>
  </defs>

  <rect width="1440" height="850" fill="#05070d"/>
  <rect width="1440" height="850" fill="url(#grid)" opacity="0.55"/>
  <ellipse cx="720" cy="10" rx="700" ry="320" fill="url(#halo)"/>

  <!-- Encabezado -->
  <g font-family="Inter, Segoe UI, system-ui, sans-serif">
    <text x="64" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#00d4ff" letter-spacing="3.2">GESTURECUBE · ARQUITECTURA</text>
    <text x="64" y="100" font-size="34" font-weight="700" fill="#eaf6ff">Un cubo que gira <tspan fill="#00d4ff">en el navegador</tspan>, no en la placa</text>
    <text x="64" y="128" font-size="14" fill="#7f96ad">Cámara UVC → V4L2/OpenCV → MJPEG → navegador → MediaPipe WASM/WebGL → motor de gestos → cubo CSS 3D</text>
  </g>
  <g>
    <rect x="1160" y="62" width="216" height="44" rx="22" fill="#07131a" stroke="#134a5c"/>
    <circle cx="1186" cy="84" r="4" fill="#b8ff4f"/>
    <text x="1200" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#b8ff4f" letter-spacing="1.2">100 % LAN · SIN INTERNET</text>
  </g>

  <!-- Zona UNO Q -->
  <rect x="48" y="160" width="600" height="600" rx="20" fill="url(#zoneUno)" stroke="#123049"/>
  <path d="M76 168 H300" stroke="#00d4ff" stroke-width="2" opacity="0.55"/>
  <text x="80" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#00d4ff" letter-spacing="2.4">UNO Q · LADO LINUX</text>
  <text x="80" y="224" font-size="12" fill="#6b8299">Debian 13 · Python 3.13 · servicio systemd</text>

  <!-- Tarjeta 1 servidor -->
  <rect x="80" y="240" width="536" height="78" rx="12" fill="url(#card)" stroke="#16283d"/>
  <rect x="80" y="252" width="3" height="54" rx="1.5" fill="#00d4ff"/>
  <text x="100" y="270" font-size="17" font-weight="600" fill="#eaf6ff">Cámara USB UVC</text>
  <text x="100" y="294" font-size="13" fill="#7f96ad">640 × 480 · 30 fps · aparece como /dev/videoN</text>
  <text x="598" y="266" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#39536b">01</text>

  <path d="M348 318 V336" stroke="#00d4ff" stroke-width="1.6" opacity="0.75" marker-end="url(#arw)"/>

  <!-- Tarjeta 2 -->
  <rect x="80" y="340" width="536" height="96" rx="12" fill="url(#card)" stroke="#16283d"/>
  <rect x="80" y="352" width="3" height="72" rx="1.5" fill="#00d4ff"/>
  <text x="100" y="370" font-size="17" font-weight="600" fill="#eaf6ff">V4L2 + OpenCV</text>
  <text x="100" y="394" font-size="13" fill="#7f96ad">escanea /dev/video0..9 · descarta los nodos venus / qcom</text>
  <text x="100" y="416" font-size="13" fill="#7f96ad">espeja el frame · codifica JPEG con calidad 82</text>
  <text x="598" y="366" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#39536b">02</text>

  <path d="M348 436 V454" stroke="#00d4ff" stroke-width="1.6" opacity="0.75" marker-end="url(#arw)"/>

  <!-- Tarjeta 3 -->
  <rect x="80" y="458" width="536" height="96" rx="12" fill="url(#card)" stroke="#16283d"/>
  <rect x="80" y="470" width="3" height="72" rx="1.5" fill="#00d4ff"/>
  <text x="100" y="488" font-size="17" font-weight="600" fill="#eaf6ff">CameraWorker</text>
  <text x="100" y="512" font-size="13" fill="#7f96ad">loop limitado a 20 fps · placeholder si no hay cámara</text>
  <text x="100" y="534" font-size="13" fill="#7f96ad">reintenta la apertura cada 5 s · libera al desconectar</text>
  <text x="598" y="484" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#39536b">03</text>

  <path d="M348 554 V572" stroke="#00d4ff" stroke-width="1.6" opacity="0.75" marker-end="url(#arw)"/>

  <!-- Tarjeta 4 -->
  <rect x="80" y="576" width="536" height="96" rx="12" fill="url(#card)" stroke="#00d4ff" stroke-opacity="0.45"/>
  <rect x="80" y="588" width="3" height="72" rx="1.5" fill="#00d4ff"/>
  <text x="100" y="606" font-size="17" font-weight="600" fill="#eaf6ff">HTTP · /video</text>
  <text x="100" y="630" font-size="13" fill="#7f96ad">multipart/x-mixed-replace · boundary=frame · 15 fps</text>
  <text x="100" y="652" font-size="13" fill="#7f96ad">escucha en 0.0.0.0:8091 · también /api/state y /healthz</text>
  <text x="598" y="602" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#39536b">04</text>

  <text x="80" y="712" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4d6178">usuario arduino · grupo video · Restart=always · RestartSec=5</text>
  <text x="80" y="734" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4d6178">la red neuronal NO se ejecuta acá</text>

  <!-- Zona navegador -->
  <rect x="792" y="160" width="600" height="600" rx="20" fill="url(#zoneWeb)" stroke="#3a1e3f"/>
  <path d="M820 168 H1044" stroke="#ff4fd8" stroke-width="2" opacity="0.55"/>
  <text x="824" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ff4fd8" letter-spacing="2.4">NAVEGADOR DEL VISITANTE</text>
  <text x="824" y="224" font-size="12" fill="#8b7a91">PC o teléfono · sin instalar nada · Chrome / Edge</text>

  <!-- Tarjeta 1 web -->
  <rect x="824" y="240" width="536" height="78" rx="12" fill="url(#card)" stroke="#2b2036"/>
  <rect x="824" y="252" width="3" height="54" rx="1.5" fill="#ff4fd8"/>
  <text x="844" y="270" font-size="17" font-weight="600" fill="#eaf6ff">&lt;img src="/video"&gt; + canvas</text>
  <text x="844" y="294" font-size="13" fill="#7f96ad">MJPEG copiado a un canvas 640×480 · /api/state cada 1 s</text>
  <text x="1342" y="266" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4a3a55">01</text>

  <path d="M1092 318 V336" stroke="#ff4fd8" stroke-width="1.6" opacity="0.75" marker-end="url(#arwPink)"/>

  <!-- Tarjeta 2 web -->
  <rect x="824" y="340" width="536" height="96" rx="12" fill="url(#card)" stroke="#2b2036"/>
  <rect x="824" y="352" width="3" height="72" rx="1.5" fill="#ff4fd8"/>
  <text x="844" y="370" font-size="17" font-weight="600" fill="#eaf6ff">MediaPipe HandLandmarker</text>
  <text x="844" y="394" font-size="13" fill="#7f96ad">Tasks Vision 1.2.3 · WASM · delegate GPU con fallback a CPU</text>
  <text x="844" y="416" font-size="13" fill="#7f96ad">2 manos · 21 landmarks · detección a ~15 fps</text>
  <text x="1342" y="366" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4a3a55">02</text>

  <path d="M1092 436 V454" stroke="#ff4fd8" stroke-width="1.6" opacity="0.75" marker-end="url(#arwPink)"/>

  <!-- Tarjeta 3 web -->
  <rect x="824" y="458" width="536" height="96" rx="12" fill="url(#card)" stroke="#2b2036"/>
  <rect x="824" y="470" width="3" height="72" rx="1.5" fill="#ff4fd8"/>
  <text x="844" y="488" font-size="17" font-weight="600" fill="#eaf6ff">Motor de gestos JS</text>
  <text x="844" y="512" font-size="13" fill="#7f96ad">conteo de dedos · puño / palma · barridos horizontales</text>
  <text x="844" y="534" font-size="13" fill="#7f96ad">4 frames estables · cooldown 0,9 s · etiqueta de mano invertida</text>
  <text x="1342" y="484" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4a3a55">03</text>

  <path d="M1092 554 V572" stroke="#ff4fd8" stroke-width="1.6" opacity="0.75" marker-end="url(#arwPink)"/>

  <!-- Tarjeta 4 web -->
  <rect x="824" y="576" width="536" height="96" rx="12" fill="url(#card)" stroke="#ff4fd8" stroke-opacity="0.4"/>
  <rect x="824" y="588" width="3" height="72" rx="1.5" fill="#ff4fd8"/>
  <text x="844" y="606" font-size="17" font-weight="600" fill="#eaf6ff">Cubo Rubik CSS 3D</text>
  <text x="844" y="630" font-size="13" fill="#7f96ad">26 cubies · 6 caras por cubie · rotateX(-22°) + rotateY(yaw)</text>
  <text x="844" y="652" font-size="13" fill="#7f96ad">barrido = ±90° · giro continuo = 1,55 rad/s con rAF</text>
  <text x="1342" y="602" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4a3a55">04</text>

  <text x="824" y="712" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5b4a64">modelo 7,5 MB · runtime WASM 29 MB · servidos desde static/</text>
  <text x="824" y="734" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5b4a64">ningún frame abandona la LAN</text>

  <!-- Enlace MJPEG entre zonas -->
  <path d="M616 624 H696 Q720 624 720 600 V300 Q720 276 744 276 H812" fill="none" stroke="#00d4ff" stroke-width="2" marker-end="url(#arw)"/>
  <text x="750" y="470" transform="rotate(-90 750 470)" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#00d4ff" letter-spacing="1.4">MJPEG 640 × 480</text>
  <text x="750" y="575" transform="rotate(-90 750 575)" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#4d7f92" letter-spacing="1">HTTP/1.0</text>

  <!-- Chips inferiores -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <rect x="48" y="790" width="424" height="40" rx="10" fill="#081019" stroke="#15293b"/>
    <circle cx="70" cy="810" r="4" fill="#00d4ff"/>
    <text x="86" y="814" fill="#8fb3c7">El video nunca sale de la LAN</text>

    <rect x="492" y="790" width="456" height="40" rx="10" fill="#081019" stroke="#15293b"/>
    <circle cx="514" cy="810" r="4" fill="#b8ff4f"/>
    <text x="530" y="814" fill="#8fb3c7">Offline: sin CDN, sin nube, sin API keys</text>

    <rect x="968" y="790" width="424" height="40" rx="10" fill="#081019" stroke="#15293b"/>
    <circle cx="990" cy="810" r="4" fill="#ffc247"/>
    <text x="1006" y="814" fill="#8fb3c7">La UNO Q solo captura y sirve JPEG</text>
  </g>
</svg>
